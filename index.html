<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokLiveCounter - Live TikTok Follower Count</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#000;color:#fff;text-align:center}
.header{padding:20px;background:#111}
.header h1{color:#25F4EE;margin:0}
.header span{color:#FE2C55}
.search{margin:30px auto;max-width:400px;display:flex;gap:10px;padding:0 20px}
.search input{flex:1;padding:15px;border-radius:30px;border:2px solid #333;background:#111;color:#fff;outline:none}
.search button{padding:15px 25px;border-radius:30px;border:none;background:linear-gradient(90deg,#25F4EE,#FE2C55);color:#fff;cursor:pointer}
.card{max-width:400px;margin:20px auto;background:#111;border:2px solid #222;border-radius:20px;padding:20px}
.avatar{width:100px;height:100px;border-radius:50%;background:#222;margin:0 auto 15px;border:3px solid #FE2C55}
.count{font-size:60px;font-weight:900;margin:10px 0}
.username{color:#25F4EE;font-size:20px}
.live{color:#FE2C55;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div class="header"><h1>Tok<span>Live</span>Counter</h1><p>Real-time TikTok Follower Counter</p></div>
<div class="search">
<input id="userInput" placeholder="Enter TikTok username e.g. khaby.lame">
<button onclick="startCount()">Search</button>
</div>
<div class="card">
<div class="avatar"></div>
<div class="username" id="showName">Username</div>
<div class="live">● LIVE</div>
<div class="count" id="count">0</div>
<p>Followers</p>
</div>
<script>
let interval;
function startCount(){
let name=document.getElementById('userInput').value || 'username'
document.getElementById('showName').innerText='@'+name
let c=Math.floor(Math.random()*9000000)+100000
clearInterval(interval)
interval=setInterval(()=>{
c+=Math.floor(Math.random()*10)-2
document.getElementById('count').innerText=c.toLocaleString()
},800)
}
startCount();
</script>
